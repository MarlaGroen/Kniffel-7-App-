<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Kniffel 7</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#070b16;--cyan:#22d3ee;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#183467,#0b1223 38%,#070b16 72%);background-attachment:fixed}.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 10px calc(80px + env(safe-area-inset-bottom))}.top,.brand,.toolbar{display:flex;align-items:center}.top{justify-content:space-between;gap:10px}.brand{gap:10px}.toolbar{gap:7px}.die{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#22d3ee,#6366f1);font-size:25px}.title{font-size:26px;font-weight:950}.sub,.hint{color:#94a3b8}.sub{font-size:12px}.ghost{border:1px solid #3b4a62;background:#101827;color:#e2e8f0;border-radius:12px;min-height:42px;padding:0 11px;font-weight:800}.players{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 12px}.player{position:relative;border:1px solid #2c3a50;background:#111827e8;border-radius:19px;padding:13px}.player.active{border-color:var(--cyan);box-shadow:0 0 0 1px #22d3ee55,0 12px 30px #06b6d41c;transform:translateY(-2px)}.name{font-weight:850}.score{font-size:29px;font-weight:950}.pill{position:absolute;right:9px;top:9px;padding:4px 7px;border-radius:99px;background:#164e63;color:#67e8f9;font-size:10px;font-weight:900}.progress{height:5px;background:#182235;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#818cf8)}.section{border:1px solid #263449;background:#111827e8;border-radius:21px;overflow:hidden;margin:11px 0;box-shadow:0 16px 40px #0003}.head{padding:13px 15px;font-size:17px;font-weight:900;background:linear-gradient(90deg,#17233a,#111a2c);display:flex;justify-content:space-between}.head small{font-size:11px;color:#94a3b8}.row{display:grid;grid-template-columns:1fr 82px 88px;gap:7px;align-items:center;padding:9px 11px;border-top:1px solid #202d40}.cat{font-weight:720;font-size:14px}.hint{display:block;font-size:10px;margin-top:2px;font-weight:500}button{font:inherit;cursor:pointer}.points,.strike{min-height:46px;border-radius:12px;font-weight:900}.points{border:1px solid #0e7490;background:#083344;color:#67e8f9}.points.done{border-color:#15803d;background:#052e16;color:#86efac}.strike{border:1px solid #7f1d1d;background:#301217;color:#fca5a5;font-size:12px}.summary{padding:12px 15px;border-top:1px solid #202d40;display:flex;justify-content:space-between;font-weight:800;font-size:13px}.summary strong{font-size:16px}.bonus{color:var(--gold)}.modal{position:fixed;inset:0;background:#020617d9;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10;backdrop-filter:blur(5px)}.modal.show{display:flex}.sheet{width:min(100%,520px);background:#111827;border:1px solid #475569;border-radius:25px;padding:19px;margin-bottom:env(safe-area-inset-bottom)}.sheet h2{margin:0 0 4px}.sheet p{color:#94a3b8;margin:0 0 14px}.input{display:flex;gap:8px}.input input{width:100%;min-height:54px;border-radius:14px;border:1px solid #475569;background:#0b1220;color:white;padding:0 14px;font-size:21px}.save,.primary{border:0;border-radius:14px;background:linear-gradient(90deg,#22d3ee,#818cf8);color:#06202a;font-weight:950}.save{padding:0 20px}.cancel{width:100%;margin-top:9px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#166534;padding:11px 16px;border-radius:13px;font-weight:800;display:none;z-index:20;white-space:nowrap}.finish{text-align:center}.trophy{font-size:55px}.winner{font-size:28px;font-weight:950;margin:8px}.primary{width:100%;min-height:52px;margin-top:10px}@media(max-width:420px){.row{grid-template-columns:1fr 70px 78px;padding-inline:8px}.strike{font-size:11px}.title{font-size:23px}.cat{font-size:13px}}</style></head><body><main class="app"><div class="top"><div class="brand"><div class="die">⚄</div><div><div class="title">Kniffel 7</div><div class="sub" id="round"></div></div></div><div class="toolbar"><button class="ghost" id="undo">↶</button><button class="ghost" id="reset">Neu</button></div></div><div class="players" id="players"></div><section class="section"><div class="head"><span>Oberer Bereich</span><small>Bonus sammeln</small></div><div id="upper"></div><div class="summary"><span>Zwischensumme</span><strong id="upperSum"></strong></div><div class="summary bonus"><span id="bonusText"></span><strong id="bonus"></strong></div><div class="summary bonus"><span>Top-Bonus ab 84</span><strong id="topBonus"></strong></div></section><section class="section"><div class="head"><span>Unterer Bereich</span><small>Große Punkte</small></div><div id="lower"></div><div class="summary"><span>Gesamtpunkte</span><strong id="grand"></strong></div></section></main><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><p>Punktzahl des Wurfs eintragen</p><form id="form" class="input"><input id="input" type="number" min="0" max="99" inputmode="numeric" required><button class="save">OK</button></form><button class="ghost cancel" id="cancel">Abbrechen</button></div></div><div class="modal" id="finish"><div class="sheet finish"><div class="trophy">🏆</div><div class="sub">PARTIE BEENDET</div><div class="winner" id="winner"></div><div id="finalScores"></div><button class="primary" id="again">Neue Partie</button><button class="ghost cancel" id="closeFinish">Ergebnis ansehen</button></div></div><div class="toast" id="toast"></div><script>const cats=[['ones','Einser','u','upper'],['twos','Zweier','u','upper'],['threes','Dreier','u','upper'],['fours','Vierer','u','upper'],['fives','Fünfer','u','upper'],['sixes','Sechser','u','upper'],['sevens','Siebener','u','upper'],['fourkind','Viererpasch','l','sum','mind. 4 gleiche · alle Augen'],['fivekind','Fünferpasch','l','sum','mind. 5 gleiche · alle Augen'],['doubletriple','Doppel-Tripel','l','fixed','direkt 25 Punkte',25],['fiveStraight','Fünferstraße','l','fixed','direkt 30 Punkte',30],['sixStraight','Sechserstraße','l','fixed','direkt 40 Punkte',40],['super','Super-Kniffel','l','fixed','direkt 60 Punkte',60],['chance','Chance','l','sum','alle 7 Würfel zählen']].map(x=>({id:x[0],n:x[1],area:x[2],m:x[3],h:x[4],v:x[5]}));const blank=()=>Object.fromEntries(cats.map(c=>[c.id,null])),fresh=()=>({players:[{name:'Florian',s:blank()},{name:'Sarah',s:blank()}],turn:0,history:[],finished:false});let state;try{state=JSON.parse(localStorage.getItem('k7state'))||fresh()}catch{state=fresh()}state.finished??=false;let editing=null;const $=s=>document.querySelector(s),done=p=>cats.filter(c=>p.s[c.id]!==null).length,upper=p=>cats.filter(c=>c.area==='u').reduce((a,c)=>a+(p.s[c.id]??0),0),bonuses=p=>[upper(p)>=63?35:0,upper(p)>=84?35:0];function total(p){let[b,t]=bonuses(p);return upper(p)+b+t+cats.filter(c=>c.area==='l').reduce((a,c)=>a+(p.s[c.id]??0),0)}function persist(){localStorage.setItem('k7state',JSON.stringify(state))}function row(c){let v=state.players[state.turn].s[c.id];return `<div class="row"><div class="cat">${c.n}<span class="hint">${c.h||'Summe gleicher Augen'}</span></div><button class="points ${v!==null?'done':''}" data-score="${c.id}" ${v!==null?'disabled':''}>${v!==null?v:(c.m==='fixed'?c.v:'–')}</button><button class="strike" data-strike="${c.id}" ${v!==null?'disabled':''}>${v===0?'✕':'Streichen'}</button></div>`}function render(){let p=state.players[state.turn],moves=state.players.reduce((a,x)=>a+done(x),0);$('#players').innerHTML=state.players.map((x,i)=>`<div class="player ${i===state.turn?'active':''}"><div class="name">${x.name}</div><div class="score">${total(x)}</div>${i===state.turn?'<span class="pill">DRAN</span>':''}<div class="progress"><i style="width:${done(x)/14*100}%"></i></div></div>`).join('');$('#upper').innerHTML=cats.filter(c=>c.area==='u').map(row).join('');$('#lower').innerHTML=cats.filter(c=>c.area==='l').map(row).join('');let u=upper(p),[b,t]=bonuses(p);$('#upperSum').textContent=u;$('#bonus').textContent=b;$('#topBonus').textContent=t;$('#bonusText').textContent=u<63?`Noch ${63-u} bis Bonus`:'Bonus erreicht';$('#grand').textContent=total(p);$('#round').textContent=moves>=28?'Partie beendet':`Runde ${Math.min(14,Math.floor(moves/2)+1)} / 14`;bind()}function snap(){state.history.push(JSON.stringify({players:state.players,turn:state.turn,finished:state.finished}));if(state.history.length>40)state.history.shift()}function commit(id,v){snap();let who=state.players[state.turn].name,c=cats.find(x=>x.id===id);state.players[state.turn].s[id]=v;state.turn=(state.turn+1)%2;state.finished=state.players.every(x=>done(x)===14);persist();toast(`${c.n}: ${v} Punkte für ${who}`);render();if(state.finished)setTimeout(showFinish,450)}function bind(){document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let c=cats.find(x=>x.id===b.dataset.score);if(c.m==='fixed')commit(c.id,c.v);else{editing=c.id;$('#modalTitle').textContent=c.n;$('#input').value='';$('#modal').classList.add('show');setTimeout(()=>$('#input').focus(),60)}});document.querySelectorAll('[data-strike]').forEach(b=>b.onclick=()=>commit(b.dataset.strike,0))}function toast(t){let e=$('#toast');e.textContent='✓ '+t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1500)}function showFinish(){let s=state.players.map(x=>({n:x.name,s:total(x)})),m=Math.max(...s.map(x=>x.s)),w=s.filter(x=>x.s===m);$('#winner').textContent=w.length>1?'Unentschieden!':`${w[0].n} gewinnt!`;$('#finalScores').innerHTML=s.map(x=>`<div class="summary"><span>${x.n}</span><strong>${x.s} Punkte</strong></div>`).join('');$('#finish').classList.add('show')}function newGame(){state=fresh();persist();$('#finish').classList.remove('show');render()}$('#form').onsubmit=e=>{e.preventDefault();let n=Number($('#input').value);if(Number.isFinite(n)){ $('#modal').classList.remove('show');commit(editing,Math.max(0,Math.round(n)))}};$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#undo').onclick=()=>{let x=state.history.pop();if(!x)return;let h=JSON.parse(x);state.players=h.players;state.turn=h.turn;state.finished=h.finished||false;persist();render()};$('#reset').onclick=()=>confirm('Neue Partie starten?')&&newGame();$('#again').onclick=newGame;$('#closeFinish').onclick=()=>$('#finish').classList.remove('show');render();if(state.finished)setTimeout(showFinish,200);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
