<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>Kniffel 7</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#090f1d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172554,#090f1d 42%);min-height:100vh}.app{max-width:720px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:28px;font-weight:900}.sub{color:#94a3b8;font-size:13px}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.player{border:1px solid #334155;background:#111827cc;border-radius:20px;padding:14px}.player.active{outline:2px solid #22d3ee}.name{font-weight:800}.score{font-size:28px;font-weight:900;margin-top:3px}.pill{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:99px;background:#164e63;color:#67e8f9;font-size:11px;font-weight:800}.section{border:1px solid #334155;background:#111827d9;border-radius:22px;overflow:hidden;margin:12px 0}.head{padding:14px 16px;font-size:19px;font-weight:900;background:#172033}.row{display:grid;grid-template-columns:1fr 90px 96px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid #263244}.cat{font-weight:650}.hint{display:block;color:#94a3b8;font-size:11px;margin-top:2px}button{font:inherit;cursor:pointer}.points,.strike{min-height:48px;border-radius:13px;font-weight:900}.points{border:1px solid #0891b2;background:#083344;color:#67e8f9}.points.done{border-color:#16a34a;background:#052e16;color:#86efac}.strike{border:1px solid #b91c1c;background:#3f1117;color:#f87171}.summary{padding:14px 16px;border-top:1px solid #263244;display:flex;justify-content:space-between;font-weight:800}.bonus{color:#fbbf24}.toolbar{display:flex;gap:8px}.ghost{border:1px solid #475569;background:#111827;color:#e2e8f0;border-radius:12px;padding:9px 12px}.modal{position:fixed;inset:0;background:#020617cc;display:none;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{width:min(100%,520px);background:#111827;border:1px solid #475569;border-radius:24px;padding:18px}.sheet h2{margin:0 0 4px}.sheet p{color:#94a3b8;margin:0 0 14px}.input{display:flex;gap:8px}.input input{width:100%;min-height:52px;border-radius:14px;border:1px solid #475569;background:#0f172a;color:white;padding:0 14px;font-size:20px}.save{border:0;border-radius:14px;background:#06b6d4;color:#06202a;font-weight:900;padding:0 18px}.cancel{width:100%;margin-top:9px;min-height:44px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#166534;padding:11px 16px;border-radius:12px;font-weight:800;display:none;z-index:4}@media(max-width:480px){.row{grid-template-columns:1fr 76px 86px}.strike{font-size:13px}.app{padding-inline:9px}.title{font-size:24px}}
</style>
</head><body><main class="app"><div class="top"><div><div class="title">Kniffel 7</div><div class="sub" id="round">Runde 1 / 14</div></div><div class="toolbar"><button class="ghost" id="undo">↶</button><button class="ghost" id="reset">Neu</button></div></div><div class="players" id="players"></div><section class="section"><div class="head">↑ Oberer Bereich</div><div id="upper"></div><div class="summary"><span>Zwischensumme</span><span id="upperSum">0</span></div><div class="summary bonus"><span id="bonusText">Noch 63 bis Bonus</span><span id="bonus">0</span></div><div class="summary bonus"><span>Top-Bonus ab 84</span><span id="topBonus">0</span></div></section><section class="section"><div class="head">↓ Unterer Bereich</div><div id="lower"></div><div class="summary"><span>Gesamtpunkte</span><span id="grand">0</span></div></section></main><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle"></h2><p>Punktzahl des Wurfs eintragen</p><form id="form" class="input"><input id="input" type="number" min="0" max="99" inputmode="numeric" required autofocus><button class="save">OK</button></form><button class="ghost cancel" id="cancel">Abbrechen</button></div></div><div class="toast" id="toast"></div><script>
const cats=[{id:'ones',n:'Einser',area:'u',m:'upper'},{id:'twos',n:'Zweier',area:'u',m:'upper'},{id:'threes',n:'Dreier',area:'u',m:'upper'},{id:'fours',n:'Vierer',area:'u',m:'upper'},{id:'fives',n:'Fünfer',area:'u',m:'upper'},{id:'sixes',n:'Sechser',area:'u',m:'upper'},{id:'sevens',n:'Siebener',area:'u',m:'upper'},{id:'fourkind',n:'Viererpasch',area:'l',m:'sum',h:'mind. 4 gleiche · alle Augen'},{id:'fivekind',n:'Fünferpasch',area:'l',m:'sum',h:'mind. 5 gleiche · alle Augen'},{id:'doubletriple',n:'Doppel-Tripel',area:'l',m:'fixed',v:25,h:'direkt 25 Punkte'},{id:'fiveStraight',n:'Fünferstraße',area:'l',m:'fixed',v:30,h:'direkt 30 Punkte'},{id:'sixStraight',n:'Sechserstraße',area:'l',m:'fixed',v:40,h:'direkt 40 Punkte'},{id:'super',n:'Super-Kniffel',area:'l',m:'fixed',v:60,h:'direkt 60 Punkte'},{id:'chance',n:'Chance',area:'l',m:'sum',h:'alle 7 Würfel zählen'}];
const blank=()=>Object.fromEntries(cats.map(c=>[c.id,null]));let state=JSON.parse(localStorage.getItem('k7state')||'null')||{players:[{name:'Florian',s:blank()},{name:'Sarah',s:blank()}],turn:0,history:[]};let editing=null;
function persist(){localStorage.setItem('k7state',JSON.stringify(state))}function upper(p){return cats.filter(c=>c.area==='u').reduce((a,c)=>a+(p.s[c.id]??0),0)}function bonuses(p){let u=upper(p);return[(u>=63?35:0),(u>=84?35:0)]}function total(p){let [b,t]=bonuses(p);return upper(p)+b+t+cats.filter(c=>c.area==='l').reduce((a,c)=>a+(p.s[c.id]??0),0)}function done(p){return cats.filter(c=>p.s[c.id]!==null).length}
function row(c){let v=state.players[state.turn].s[c.id],fixed=c.m==='fixed';return `<div class="row"><div class="cat">${c.n}<span class="hint">${c.h||'Summe gleicher Augen'}</span></div><button class="points ${v!==null?'done':''}" data-score="${c.id}">${v!==null?v:(fixed?c.v:'–')}</button><button class="strike" data-strike="${c.id}">${v===0?'✕':'Streichen'}</button></div>`}
function render(){let p=state.players[state.turn];document.querySelector('#players').innerHTML=state.players.map((x,i)=>`<div class="player ${i===state.turn?'active':''}"><div class="name">${x.name}</div><div class="score">${total(x)}</div>${i===state.turn?'<span class="pill">DRAN</span>':''}</div>`).join('');document.querySelector('#upper').innerHTML=cats.filter(c=>c.area==='u').map(row).join('');document.querySelector('#lower').innerHTML=cats.filter(c=>c.area==='l').map(row).join('');let u=upper(p),[b,t]=bonuses(p);document.querySelector('#upperSum').textContent=u;document.querySelector('#bonus').textContent=b;document.querySelector('#topBonus').textContent=t;document.querySelector('#bonusText').textContent=u<63?`Noch ${63-u} bis Bonus`:'Bonus erreicht';document.querySelector('#grand').textContent=total(p);document.querySelector('#round').textContent=`Runde ${Math.min(14,Math.floor((state.players.reduce((a,x)=>a+done(x),0))/2)+1)} / 14`;bind()}
function snapshot(){state.history.push(JSON.stringify({players:state.players,turn:state.turn}));if(state.history.length>30)state.history.shift()}function commit(id,v){snapshot();state.players[state.turn].s[id]=v;let who=state.players[state.turn].name,cat=cats.find(c=>c.id===id);state.turn=(state.turn+1)%state.players.length;persist();toast(`${cat.n}: ${v} Punkte für ${who}`);render()}
function bind(){document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let c=cats.find(x=>x.id===b.dataset.score);if(state.players[state.turn].s[c.id]!==null)return;if(c.m==='fixed')commit(c.id,c.v);else{editing=c.id;document.querySelector('#modalTitle').textContent=c.n;document.querySelector('#input').value='';document.querySelector('#modal').classList.add('show');setTimeout(()=>document.querySelector('#input').focus(),50)}});document.querySelectorAll('[data-strike]').forEach(b=>b.onclick=()=>{let id=b.dataset.strike;if(state.players[state.turn].s[id]===null)commit(id,0)})}function toast(t){let e=document.querySelector('#toast');e.textContent='✓ '+t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let n=Number(document.querySelector('#input').value);if(Number.isFinite(n)){document.querySelector('#modal').classList.remove('show');commit(editing,Math.max(0,Math.round(n)))}};document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').classList.remove('show');document.querySelector('#undo').onclick=()=>{let x=state.history.pop();if(!x)return;let h=JSON.parse(x);state.players=h.players;state.turn=h.turn;persist();render()};document.querySelector('#reset').onclick=()=>{if(confirm('Neue Partie starten?')){state={players:[{name:'Florian',s:blank()},{name:'Sarah',s:blank()}],turn:0,history:[]};persist();render()}};render();
</script></body></html>
